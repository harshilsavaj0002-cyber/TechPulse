    <script>
        // Function to load blog data
        async function loadBlogData() {
            try {
                const response = await fetch('blog-data.json');
                const data = await response.json();
                return data.posts;
            } catch (error) {
                console.error('Error loading blog data:', error);
                return [];
            }
        }

        // Function to format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Function to load and display blog post
        async function loadBlogPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = parseInt(urlParams.get('id'));

            if (!postId) {
                window.location.href = 'blog.html';
                return;
            }

            const posts = await loadBlogData();
            const post = posts.find(p => p.id === postId);

            if (!post) {
                window.location.href = 'blog.html';
                return;
            }

            // Update page title
            document.title = post.title + ' - TechPulse';

            // Create post content
            const content = document.getElementById('blog-post-content');
            const paragraphs = post.fullContent.split('\n');
            const midPoint = Math.floor(paragraphs.length / 2);
            
            content.innerHTML = 
                '<div class="mb-8">' +
                    '<h1 class="text-4xl font-bold mb-4">' + post.title + '</h1>' +
                    '<div class="flex items-center gap-4 text-gray-600">' +
                        '<div class="flex items-center gap-2">' +
                            '<img src="' + post.author.image + '" alt="' + post.author.name + '" class="w-10 h-10 rounded-full">' +
                            '<div>' +
                                '<p class="font-medium">' + post.author.name + '</p>' +
                                '<p class="text-sm">' + post.author.role + '</p>' +
                            '</div>' +
                        '</div>' +
                        '<span>•</span>' +
                        '<span>' + formatDate(post.date) + '</span>' +
                        '<span>•</span>' +
                        '<span>' + post.views + ' views</span>' +
                    '</div>' +
                '</div>' +
                '<img src="' + post.image + '" alt="' + post.title + ' - TechPulse Technology Article" class="w-full h-96 object-cover rounded-lg mb-8">' +
                '<div class="prose max-w-none">' +
                    paragraphs.slice(0, midPoint).map(paragraph => '<p>' + paragraph + '</p>').join('') +
                '</div>' +
                '<div class="my-8 text-center">' +
                    // '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3477495707444324" data-ad-slot="2061123290" data-ad-format="auto" data-full-width-responsive="true"></ins>' +
                    // '<script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>' +
                '</div>' +
                '<div class="prose max-w-none">' +
                    paragraphs.slice(midPoint).map(paragraph => '<p>' + paragraph + '</p>').join('') +
                '</div>' +
                '<div class="my-8 text-center">' +
                    // '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3477495707444324" data-ad-slot="2061123290" data-ad-format="auto" data-full-width-responsive="true"></ins>' +
                    // '<script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>' +
                '</div>';
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', loadBlogPost);
    </script>
